spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/lab_recruit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username={{root}}
spring.datasource.password={{replace-with-your-password}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8

app.security.jwt.secret=replace-with-strong-secret
app.security.jwt.expire-seconds=7200
app.security.jwt.remember-expire-seconds=2592000
app.security.jwt.cookie-name=lab_recruit_token
app.security.jwt.cookie-secure=false
app.security.jwt.cookie-same-site=Lax

app.auth.email-code.ttl-seconds=300
app.auth.email-code.send-cooldown-seconds=60
app.auth.login.max-fail-count=5
app.auth.login.fail-lock-seconds=900
