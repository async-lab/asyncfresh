# suppress inspection "SpringBootApplicationProperties" for whole file
spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fresh?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&sessionVariables=default_storage_engine=InnoDB}
spring.datasource.username=${DB_USERNAME:epoch}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8

spring.mail.host=${MAIL_SMTP_HOST:}
spring.mail.port=${MAIL_SMTP_PORT:465}
spring.mail.username=${MAIL_ACCOUNT:}
spring.mail.password=${MAIL_AUTH_CODE:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expire-seconds=7200
app.security.jwt.remember-expire-seconds=2592000
app.security.jwt.cookie-name=lab_recruit_token
app.security.jwt.csrf-cookie-name=XSRF-TOKEN
app.security.jwt.csrf-header-name=X-CSRF-TOKEN
app.security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
app.security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Strict}

app.auth.email-code.ttl-seconds=300
app.auth.email-code.send-cooldown-seconds=60
app.auth.email-code.max-verify-fail-count=5
app.auth.email-code.verify-lock-seconds=300
app.auth.login.max-fail-count=5
app.auth.login.fail-lock-seconds=900
app.auth.login.trust-forward-headers=${AUTH_TRUST_FORWARD_HEADERS:false}
app.auth.login.trusted-proxies=${AUTH_TRUSTED_PROXIES:}
app.auth.cache-type=${AUTH_CACHE_TYPE:redis}

app.recruitment.application.allowed-grades=${APPLICATION_ALLOWED_GRADES:YEAR_1,YEAR_2}

app.bootstrap.default-admin.enabled=${DEFAULT_ADMIN_ENABLED:true}
app.bootstrap.default-admin.username=${DEFAULT_ADMIN_USERNAME:}
app.bootstrap.default-admin.password=${DEFAULT_ADMIN_PASSWORD:}
app.bootstrap.default-admin.email=${DEFAULT_ADMIN_EMAIL:}
